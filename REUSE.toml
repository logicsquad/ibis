# Copyright and licensing for files that can't carry their own notice.
# See https://reuse.software/ and check with `reuse lint`.
version = 1
SPDX-PackageName = "Ibis"
SPDX-PackageSupplier = "Logic Squad <https://logicsquad.net/>"
SPDX-PackageDownloadLocation = "https://github.com/logicsquad/ibis"

# Everything else, unless a later annotation says otherwise
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2025 Logic Squad"
SPDX-License-Identifier = "BSD-2-Clause"

# Word lists compiled by Logic Squad
[[annotations]]
path = [
    "src/main/resources/en/words-2.txt",
    "src/main/resources/en/names-2.txt",
    "src/main/resources/en/acronyms.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2025 Logic Squad"
SPDX-License-Identifier = "CC0-1.0"

# 3of6game from 12dicts 6.0
[[annotations]]
path = "src/main/resources/en/words-1.txt.gz"
precedence = "override"
SPDX-FileCopyrightText = "Alan Beale"
SPDX-License-Identifier = "LicenseRef-12dicts"

# propernames from 4.4BSD-Lite, via FreeBSD
[[annotations]]
path = "src/main/resources/en/names-1.txt.gz"
precedence = "override"
SPDX-FileCopyrightText = "The Regents of the University of California"
SPDX-License-Identifier = "BSD-3-Clause"
